<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="柔和的夜色与花园插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2350"/>
      <stop offset="0.38" stop-color="#6f5b9e"/>
      <stop offset="0.68" stop-color="#d79ab8"/>
      <stop offset="1" stop-color="#ffe4e9"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="0.7" stop-color="#fff3cf"/>
      <stop offset="1" stop-color="#ffd9a8"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff1c9" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ffd6e2" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffd6e2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4a86"/>
      <stop offset="1" stop-color="#2c2448"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9284c7"/>
      <stop offset="1" stop-color="#3a315e"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="smallSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
