<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-label="发光的叶子和水面的涟漪">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#4a3b6e"/>
      <stop offset="0.55" stop-color="#2a2449"/>
      <stop offset="1" stop-color="#121225"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9f0d0"/>
      <stop offset="0.5" stop-color="#7fd6b5"/>
      <stop offset="1" stop-color="#3f8f86"/>
    </linearGradient>
    <linearGradient id="vein" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fffbd6"/>
      <stop offset="1" stop-color="#c8ffd9"/>
