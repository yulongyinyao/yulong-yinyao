      <stop offset="0.5" stop-color="#9ff0c9" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#9ff0c9" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
