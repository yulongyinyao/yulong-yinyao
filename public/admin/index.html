<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <title>内容后台 · yulong_yinyao</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fbf7f4;
        --ink: #2f2a33;
        --muted: #7c7480;
        --card: rgba(255, 255, 255, 0.82);
        --line: rgba(120, 100, 120, 0.16);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14111b;
          --ink: #f4eef7;
          --muted: #a89fb2;
          --card: rgba(30, 25, 40, 0.86);
          --line: rgba(255, 255, 255, 0.1);
        }
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        margin: 0;
        background:
          radial-gradient(60rem 30rem at 10% -10%, rgba(251, 113, 133, 0.14), transparent 70%),
          radial-gradient(50rem 28rem at 100% 0%, rgba(167, 139, 250, 0.14), transparent 70%),
          var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #nc-root {
        min-height: 100vh;
      }
      #cms-loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        z-index: 50;
        background: var(--bg);
      }
      .cms-loading-card {
        width: min(28rem, 100%);
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 24px 80px rgba(60, 40, 70, 0.12);
        backdrop-filter: blur(18px);
        text-align: center;
      }
      .cms-loading-card h1 {
        margin: 0;
        font-size: 1.05rem;
        letter-spacing: 0.02em;
      }
      .cms-loading-card p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.7;
      }
      .cms-loading-dots {
        display: inline-flex;
        gap: 6px;
        margin-top: 18px;
      }
      .cms-loading-dots span {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: #fb7185;
        animation: cms-bounce 1.2s infinite ease-in-out;
      }
      .cms-loading-dots span:nth-child(2) {
        background: #c084fc;
        animation-delay: 0.12s;
      }
      .cms-loading-dots span:nth-child(3) {
        background: #a78bfa;
        animation-delay: 0.24s;
      }
      @keyframes cms-bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.5;
        }
        40% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cms-loading-dots span {
          animation: none;
        }
      }
    </style>
  </head>
  <body data-pagefind-ignore>
    <!-- Sveltia 会挂载到这里；不要删除。 -->
    <div id="nc-root"></div>

    <div id="cms-loading">
      <div class="cms-loading-card">
        <h1>yulong_yinyao · 内容后台</h1>
        <p>正在加载编辑器。首次打开需要授权 GitHub 仓库，授权信息只保存在这台设备的浏览器里。</p>
        <div class="cms-loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        <noscript><p>后台需要 JavaScript，请在浏览器设置中开启后刷新。</p></noscript>
      </div>
    </div>

    <!--
      由 scripts/copy-cms.mjs 从 node_modules/@sveltia/cms/dist/sveltia-cms.js 复制而来。
      不要手动修改这个文件；升级依赖后重新执行 pnpm install 或 pnpm cms:copy。
    -->
    <script src="./sveltia-cms.js"></script>
    <script>
      (function () {
        var loader = document.getElementById('cms-loading');
        var poll = window.setInterval(function () {
          if (document.querySelector('#nc-root .sui.app-shell')) {
            window.clearInterval(poll);
            if (loader) loader.remove();
          }
        }, 250);

        // 加载失败时给出可操作的提示，而不是一直转圈。
        window.setTimeout(function () {
          if (document.querySelector('#nc-root .sui.app-shell')) {
            if (loader) loader.remove();
            return;
          }
          window.clearInterval(poll);
          var card = document.querySelector('.cms-loading-card');
          if (!card) return;
          card.innerHTML =
            '<h1>编辑器没有加载出来</h1>' +
            '<p>请确认 <code>public/admin/sveltia-cms.js</code> 存在。本地开发时运行 <code>pnpm cms:copy</code>；部署时构建命令会自动复制。</p>' +
            '<p>如果文件存在仍然报错，请打开浏览器控制台查看具体错误。</p>';
        }, 15000);
      })();
    </script>
  </body>
</html>
